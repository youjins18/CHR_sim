palletrone_flight_controller:
  ros__parameters:
    control_hz: 250.0
    # Controller-side estimates intentionally differ slightly from the measured
    # MuJoCo plant: mass +0.44%, rotor radius -0.43%, reaction coefficient +0.56%.
    # Keep the MJCF model unchanged when tuning this small model uncertainty.
    mass_kg: 5.90
    gravity: 9.81
    position_kp: [4.0, 4.0, 7.0]
    position_ki: [0.05, 0.05, 0.20]
    position_kd: [4.0, 4.0, 5.0]
    position_integral_limit: [1.0, 1.0, 1.0]
    attitude_kp: [8.0, 8.0, 4.0]
    attitude_ki: [3.0, 3.0, 1.0]
    attitude_kd: [2.0, 2.0, 1.2]
    attitude_integral_limit: [0.5, 0.5, 0.5]
    inertia_diagonal_kg_m2: [0.18, 0.18, 0.20]
    dob_enabled: true
    dob_cutoff_hz: 1.0                # [hz]
    dob_gain: [1.0, 1.0, 1.0]
    rotor_radius_m: 0.229
    reaction_torque_coefficient: 0.0181
    minimum_thrust_n: 0.5
    maximum_thrust_n: 38.52
    maximum_servo_angle_rad: 0.7
    # New motor: T-Motor CINE77 KV977 + C10.5x5x3 (datasheet, 24 V).
    # Quadratic fit over 10-80% throttle: thrust [N] = a*pwm_us^2 + b*pwm_us + c.
    pwm_quadratic_n_per_us2: 0.00004045973
    pwm_linear_n_per_us: -0.048579
    pwm_constant_n: 1.0186
    pwm_min_us: 1100.0
    pwm_max_us: 1900.0
    pwm_normalized_limit: 0.8
    reference_timeout_s: 0.5
